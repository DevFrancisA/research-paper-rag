services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [./qdrant_storage:/qdrant/storage]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      QDRANT_URL: http://qdrant:6333
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
      UPLOAD_DIR: /app/uploads
    ports: ["8000:8000"]
    volumes: [./uploads:/app/uploads]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}

  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://api:8000/api/inngest --no-discovery
    ports: ["8288:8288"]
    depends_on: [api]

  ui:
    build: .
    command: ["uv", "run", "--no-sync", "streamlit", "run", "streamlit_app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  postgres_data:
